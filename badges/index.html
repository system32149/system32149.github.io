<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges</title>
  </head>
  <body>
    <header>
      <h1>Badges</h1>
    </header>
    <main>
      <p>I make some badges for use on other websites. Feel free to use them!</p>
      <section>
        <h2>Aliucord</h2>
        <a href="https://aliucord.com">

          <summary>Embed Badge</summary>
          <p>Embed the badge using the following HTML code on your site:</p>

            <code>&lt;a href="https://aliucord.com"&gt;&lt;img src="https://system32149.github.io/badges/aliucord.png" alt="Aliucord badge" /&gt;&lt;/a&gt;</code>
          </pre>
        </details>
      </section>
    </main>

</html>
